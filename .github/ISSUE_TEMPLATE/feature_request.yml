name: 💡 Feature Request
description: Propose a new feature, HAL backend, or architectural enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Automated Recompilers better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the limitation or use-case.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Implementation Idea
      description: Describe what you would like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought of.
