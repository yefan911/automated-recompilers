name: Update Showcase & Opcode Metrics

on:
  push:
    branches:
      - main
    paths:
      - "src/lifter/**"
      - "roms/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/showcase.yml"
  pull_request:
    paths:
      - "src/lifter/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/showcase.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-showcase:
    name: Generate Showcase & Coverage Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate Opcode Coverage & Badges
        run: |
          python scripts/opcode_coverage.py

      - name: Generate Visual CFG Showcase & HTML
        run: |
          python scripts/generate_showcase.py

      - name: Upload Showcase Artifact
        uses: actions/upload-artifact@v4
        with:
          name: showcase-docs
          path: docs/

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-showcase
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
