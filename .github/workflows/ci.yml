name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Recompile (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Test End-to-End Recompilation Pipeline
        run: |
          python recompile.py roms/test/hello_gba.gba
          python -c "from pathlib import Path; assert Path('build/hello_gba_recompiled.c').is_file()"

      - name: Compile and Run Recompiled C Output
        if: runner.os == 'Linux'
        run: |
          gcc -Wall -Wextra -Werror -O2 build/hello_gba_recompiled.c -o build/hello_gba
          ./build/hello_gba
