name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-release-windows:
    name: Package Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Executable
        run: |
          python package_exe.py

      - name: Rename binary for release
        run: |
          Move-Item -Path dist\recompiler.exe -Destination dist\recompiler-windows-x64.exe

      - name: Upload Windows Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/recompiler-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-linux:
    name: Package Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Executable
        run: |
          python package_exe.py

      - name: Rename binary for release
        run: |
          mv dist/recompiler dist/recompiler-linux-x64

      - name: Upload Linux Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/recompiler-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
